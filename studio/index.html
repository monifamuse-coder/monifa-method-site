<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Studio — The Monifa Method</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .studio{max-width:640px;margin:0 auto;padding:60px 24px;}
  .studio h1{font-family:var(--serif);font-size:32px;font-weight:600;margin-bottom:8px;}
  .studio-sub{color:var(--ink-muted);font-size:14px;margin-bottom:32px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;}
  .field input, .field textarea{width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(28,28,28,0.15);font-family:var(--sans);font-size:14px;box-sizing:border-box;}
  .field textarea{min-height:180px;resize:vertical;font-family:var(--sans);line-height:1.6;}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--gold);}
  .studio-btn{width:100%;padding:14px;background:var(--gold);border:none;border-radius:8px;color:#FFFFFF;font-weight:600;font-size:15px;cursor:pointer;}
  .studio-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .status-box{margin-top:24px;padding:20px;border-radius:8px;background:var(--bg-alt);display:none;}
  .status-box.show{display:block;}
  .status-line{font-size:14px;color:var(--ink-muted);margin-bottom:8px;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .video-ready{display:none;margin-top:16px;}
  .video-ready.show{display:block;}
  .video-ready a{display:inline-block;padding:12px 24px;background:#2C4F6A;color:#FFFFFF;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;}
  .saved-note{font-size:12px;color:var(--ink-muted);margin-top:6px;}
</style>
</head>
<body>

<div class="studio">
  <h1>Video Studio</h1>
  <p class="studio-sub">Paste your script. Get a finished HeyGen video back. No dashboard, no manual upload.</p>

  <div class="field">
    <label>Avatar ID</label>
    <input type="text" id="avatarId" placeholder="e.g. Anna_public_3_20240108">
    <p class="saved-note">Find this in HeyGen → Avatars → click your avatar → copy the ID shown</p>
  </div>

  <div class="field">
    <label>Voice ID</label>
    <input type="text" id="voiceId" placeholder="e.g. 1bd001e7e50f421d891986aad5158bc">
    <p class="saved-note">Find this in HeyGen → Voices → click your chosen voice → copy the ID shown</p>
  </div>

  <div class="field">
    <label>Script (narration only)</label>
    <textarea id="script" placeholder="Paste your narration script here — the exact words Muse should say, nothing else."></textarea>
  </div>

  <button class="studio-btn" id="submitBtn" onclick="generateVideo()">Send to HeyGen →</button>

  <div class="status-box" id="statusBox">
    <p class="status-line"><span class="status-dot"></span><span id="statusText">Starting...</span></p>
  </div>

  <div class="video-ready" id="videoReady">
    <a id="videoLink" href="#" target="_blank">Download your video →</a>
  </div>
</div>

<script>
let pollTimer = null;

async function generateVideo() {
  const avatarId = document.getElementById('avatarId').value.trim();
  const voiceId = document.getElementById('voiceId').value.trim();
  const script = document.getElementById('script').value.trim();
  const btn = document.getElementById('submitBtn');
  const statusBox = document.getElementById('statusBox');
  const statusText = document.getElementById('statusText');
  const videoReady = document.getElementById('videoReady');

  if (!avatarId || !voiceId || !script) {
    alert('Please fill in the avatar ID, voice ID, and script first.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';
  statusBox.classList.add('show');
  videoReady.classList.remove('show');
  statusText.textContent = 'Sending your script to HeyGen...';

  try {
    const res = await fetch('/api/heygen-generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ script, avatarId, voiceId })
    });
    const data = await res.json();

    if (data.error) {
      statusText.textContent = 'Error: ' + data.error;
      btn.disabled = false;
      btn.textContent = 'Send to HeyGen →';
      return;
    }

    statusText.textContent = 'Rendering has started. This usually takes 2-5 minutes...';
    pollStatus(data.videoId);

  } catch (err) {
    statusText.textContent = 'Something went wrong. Try again.';
    btn.disabled = false;
    btn.textContent = 'Send to HeyGen →';
  }
}

async function pollStatus(videoId) {
  const statusText = document.getElementById('statusText');
  const videoReady = document.getElementById('videoReady');
  const videoLink = document.getElementById('videoLink');
  const btn = document.getElementById('submitBtn');

  pollTimer = setInterval(async () => {
    const res = await fetch('/api/heygen-status?videoId=' + videoId);
    const data = await res.json();

    if (data.status === 'completed') {
      clearInterval(pollTimer);
      statusText.textContent = 'Done! Your video is ready.';
      videoLink.href = data.videoUrl;
      videoReady.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Send to HeyGen →';
    } else if (data.status === 'failed') {
      clearInterval(pollTimer);
      statusText.textContent = 'HeyGen could not render this: ' + (data.failureMessage || 'unknown reason');
      btn.disabled = false;
      btn.textContent = 'Send to HeyGen →';
    } else {
      statusText.textContent = 'Still rendering... (' + (data.status || 'processing') + ')';
    }
  }, 8000); // checks every 8 seconds
}
</script>

</body>
</html>
